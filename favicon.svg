<svg width="256" height="256" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100">
            <stop stop-color="#0f3a25"/>
            <stop offset="1" stop-color="#059669"/>
        </linearGradient>
        <linearGradient id="arrowGrad" x1="40" y1="50" x2="82" y2="10">
            <stop stop-color="#34d399"/>
            <stop offset="1" stop-color="#fff"/>
        </linearGradient>
    </defs>
    
    <rect width="100" height="100" rx="24" fill="url(#bg)"/>
    
    <!-- Abstract maze box -->
    <rect x="20" y="25" width="45" height="45" rx="14" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" fill="none"/>
    <path d="M65 45 L 65 70" stroke="#10b981" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Escaping arrow -->
    <path d="M40 50 L 80 10" stroke="url(#arrowGrad)" stroke-width="12" stroke-linecap="round"/>
    <path d="M55 10 L 82 10 L 82 37" stroke="url(#arrowGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
